name: "NDSS 2026"
# Derived from the NDSS 2026 Call for Papers:
# https://www.ndss-symposium.org/ndss2026/submissions/call-for-papers/
#
# Key rules from the CFP:
#   - US Letter (not A4).
#   - 13-page main-body limit, excluding Ethics Considerations, references, and appendices.
#   - Two-column layout. Columns must be <= 9.25 in tall and <= 3.5 in wide.
#   - Times font, 10 pt or larger; line spacing 11 pt or larger.
#   - Double-blind: no author names/affiliations, third-person prior work.
#
# Side margins are derived from the column geometry:
#   Text block: 2 * 3.5in + 0.25in gap = 7.25 in wide
#   Letter page: 8.5 in x 11 in = 612 x 792 pt
#     side margins = (612 - 7.25*72) / 2 = 45 pt
#
# Vertical margins are measured from real NDSS papers built with the IEEE
# conference template. The CFP says columns must be <= 9.25 in tall, but the
# template doesn't center that block on the page — it places the first line
# higher (~0.7 in from the top) and leaves more slack at the bottom for the
# page-number footer. These numbers match ndss_2026_proceedings.yaml because
# submission and camera-ready papers use the same template.

page:
  size: letter
  max_body_pages: 13
  max_total_pages: null              # refs + appendices + ethics: unlimited
  refs_count_toward_body: false
  appendix_counts_toward_body: false
  ethics_counts_toward_body: false   # CFP excludes Ethics Considerations from the 13-page body cap

text_block:
  top_margin: 48
  bottom_margin: 55
  left_margin: 45
  right_margin: 45
  columns: 2
  column_gap: 18                      # 0.25 in

fonts:
  body:
    families: ["Times", "TimesNewRoman", "NimbusRomNo9L", "Nimbus Roman", "TeXGyreTermes", "TeX Gyre Termes"]
    min_size: 10.0
    # No explicit upper bound in the CFP ("10-point or larger").
  caption:
    min_size: 10.0

tolerance_pt: 8                       # absorbs minor template variation in the IEEE conf class

anonymization:
  required: true

# The CFP describes "Ethics Considerations" as an optional section placed
# immediately before the references. It is NOT mandatory, so it is not listed
# under required_sections. If a future edition of NDSS makes it mandatory,
# uncomment the block below.
#
# required_sections:
#   - name: "Ethics Considerations"
#     patterns: ["ethics considerations?", "ethical considerations?"]
