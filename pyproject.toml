[project]
name = "format-checker"
version = "0.1.0"
description = "Check conference submission PDFs against venue format profiles."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
format-checker = "format_checker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["format_checker", "format_checker.checks"]
include-package-data = true

[tool.setuptools.package-data]
format_checker = ["templates/*.j2"]
